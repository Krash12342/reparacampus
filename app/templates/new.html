{% extends "base.html" %}{% block content %}
<h1>Registrar incidencia</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" class="card">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label for="ubicacion">Ubicacion</label>
  <select id="ubicacion" name="ubicacion" required>{% for v in services.LOCATIONS %}
    <option {{ 'selected' if form.get('ubicacion') == v }}>{{ v }}</option>{% endfor %}</select>
  <label for="categoria">Categoria</label>
  <select id="categoria" name="categoria" required>{% for v in services.CATEGORIES %}
    <option {{ 'selected' if form.get('categoria') == v }}>{{ v }}</option>{% endfor %}</select>
  <label for="impacto">Impacto</label>
  <select id="impacto" name="impacto" required>{% for v in services.IMPACTS %}
    <option {{ 'selected' if form.get('impacto') == v }}>{{ v }}</option>{% endfor %}</select>
  <label for="riesgo">Riesgo para personas</label>
  <select id="riesgo" name="riesgo" required><option value="false">No</option><option value="true">Si</option></select>
  <label for="descripcion">Descripcion (20 a 500 caracteres)</label>
  <textarea id="descripcion" name="descripcion" rows="5" maxlength="520" required>{{ form.get('descripcion', '') }}</textarea>
  <small id="descripcion-count"></small>
  <p><button type="submit">Registrar</button></p>
</form>{% endblock %}
